# This workflow generates SLSA Level 3 provenance for release artifacts.
# Generated by OpenSSF SLSA GitHub Generator.

name: SLSA generic generator

on:
  workflow_dispatch:

  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # Build artifacts
      # ========================================================
      #
      # Replace this section with your real build commands if
      # your project produces binaries or other release files.
      #
      - name: Build artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # ========================================================
      # Generate provenance subjects
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          files=(artifact*)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No artifacts were found."
            exit 1
          fi

          sha256sum "${files[@]}" > checksums.txt

          hashes="$(base64 -w0 checksums.txt)"

          echo "hashes=${hashes}" >> "${GITHUB_OUTPUT}"

      - name: Verify generated checksums
        shell: bash
        run: |
          set -euo pipefail

          test -s checksums.txt
          cat checksums.txt

      # ========================================================
      # Upload artifacts for the provenance workflow
      # ========================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slsa-artifacts
          path: |
            artifact*
            checksums.txt
          if-no-files-found: error

  # ============================================================
  # Generate SLSA provenance
  # ============================================================
  provenance:
    name: Generate SLSA provenance
    needs: [build]

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0

    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true